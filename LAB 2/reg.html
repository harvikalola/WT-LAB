<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Reg Form</title>
  </head>
  <body>
    <h1>Student Registration Form</h1>
    <form action="welcome.html">
      <fieldset>
        <legend>Personal Information</legend>

        <label>Full Name:</label>
        <input type="text"  required/>
        <br />
        <br />

        <label>Email:</label>
        <input type="email" />
        <br />
        <br />

        <label>Password:</label>
        <input type="password" />
        <br />
        <br />

        <label>Phone number:</label>
        <input type="tel" />
        <br />
        <br />

        <label>Age:</label>
        <input type="number" />
        <br />
        <br />

        <label>Gender:</label>
        <input type="radio" /><label>Male</label> <input type="radio" /><label
          >Female</label
        >
        <br />
        <br />
      </fieldset>

      <fieldset>
        <legend>Preferences & Extras</legend>

        <label>Upload Profile Picture:</label>
        <input type="file" />
        <br />
        <br />

        <label>color:</label>
        <input type="color" />
        <br />
        <br />

        <label>Search for Course:</label>
        <input type="search" />
        <br />
        <br />

        <label>Course Interest Range:</label>
        <input type="range" />
        <br />
        <br />

        <label>Personal Website:</label>
        <input type="url" />
        <br />
        <br />

        <label>Course Type:</label>
        <select>
          <optgroup label="engg">
            <option>CE</option>
            <option>EE</option>
            <option>ME</option>
            <option>CIV</option>
          </optgroup>
          <optgroup label="Management">
            <option>BBA</option>
            <option>MBA</option>
          </optgroup>
        </select>
        <br />
        <br />

        <label>Preferred Country:</label>
        <input list="countries" />
        <datalist id="countries">
          <option>USA</option>
          <option>UK</option>
          <option>India</option>
          <option>Japan</option>
        </datalist>

        <br />
        <br />
        <label>Agree to Terms:</label>
        <input type="checkbox" /><label>I agree</label>
      </fieldset>

      <fieldset>
        <legend>Date & Time Info</legend>

        <label>Select Date of Birth: </label>
        <input type="date" />
        <br />
        <br />

        <label>Select Time: </label>
        <input type="time" />
        <br />
        <br />

        <label>Select month: </label>
        <input type="month" />
        <br />
        <br />

        <label>Select week: </label>
        <input type="week" />
        <br />
        <br />

        <label>Select date and time: </label>
        <input type="datetime-local" />
        <br />
        <br />
      </fieldset>

      <fieldset>
        <legend>Form Controls</legend>

        <button onclick="sub()">Click Me</button>
        <input type="image" src="butterfly.png" alt="Register Now" height="50" width="50" />
        <br /><br />

        <input type="submit" />
        <br /><br />

        <input type="reset" />
        <br /><br />
      </fieldset>
    </form>
    <script>
      function sub()
      {

      }
    </script>
  </body>
</html>
