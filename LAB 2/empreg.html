<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Reg Form</title>
</head>
<body>
    <h1>Employee Registration Form</h1>
    <Form>
        <fieldset>
            <legend>Personal Information</legend>
            <label>EmployeeID :</label>
                <input type="text" required/>
                <br/>
                <br/>

                <label>Full Name: </label>
                <input type="text"/>
                <br/>
                <br/>

                 <label>Dob:</label>
                <input type="date"/>
                <br/>
                <br/>

                 <label>Phone NO: </label>
                <input type="tel"/>
                <br/>
                <br/>

            <label>Age:</label>
                <input type="number"/>
                <br/>
                <br/>

                 <label>Gender:</label>
                 <input type="radio"/>Male</label>
                 <input type="radio"/>Female</label>
                <br/>
                <br/>
                <label>Upload Profile Picture:</label>
            <input type="file">
            <br/>
            <br/>
        </fieldset>
        <fieldset>
            <legend>Contact Informations</legend>
        
            <label>Email Address:</label>
            <input type="text">
            <br/>
            <br/>

            <label>Mobile No:</label>
            <input type="number">
            <br/>
            <br/>

            <label>Alternate No:</label>
            <input type="number">
            <br/>
            <br/>

            <label>Address:</label>
            <input type="text">
            <br/>
            <br/>

            <label> Permanent Address:</label>
            <input type="text">
            <br/>
            <br/>

            <label>Prefferd State:</label>
            <input list="States"/>
            <datalist id="States">
                <option>Gujarat</option>
                <option>Rajasthan</option>
                <option>Punjab</option>
                <option>Madhya Pradesh</option>
            </datalist>
            <br/>
            <br/>


        <label>Prefferd City:</label>
            <input list="Cities"/>
            <datalist id="Cities">
                <option>Rajkot</option>
                <option>Surat</option>
                <option>Junagadh</option>
                <option>Udaipur</option>
                <option>Indore</option>
            </datalist>
            <br/>
            <br/>
            <label>Agree To Terms:</label>
            <input type="checkbox"><label>I Agree</label>
        </fieldset>
        <fieldset>
            <legend>Employement Details</legend>
            <label>Date of joining:</label>
            <input type="date"/>
            <BR />
            <BR/>

            <label> Select shift:</label>
            <input type="time"/>
            <BR />
            <BR/>

            <label>Department:</label>
            <input list="Departments"/>
            <datalist id="Departments">
                <option>HR</option>
                <option>IT</option>
                <option>Finance</option>
                <option>Marketing</option>
                <option>Sales</option>
                <option>Operations</option>
            </datalist>
            <BR />
            <BR/>


            <fieldset>
                <legend>Form Controls</legend>
                <button type="image" src="mulogo.png" alt="MU LOGO FOR REGISTER NOW" HEIGHT="50PX" ></button>
                <BR/> <BR/>
                <input type="submit"/>
                <BR/> <BR/>
            </fieldset>
        </fieldset>
    </Form>
</body>
</html>
