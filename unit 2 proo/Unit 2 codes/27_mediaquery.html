<!DOCTYPE html>
<html>
<head>
    <title>Media Query</title>

    <style>
        .box {
            width: 500px;
            height: 200px;
            background-color: lightblue;
            font-size: 30px;
        }

       
        /* For screens 600px or smaller */
        @media (max-width: 600px) and (min-width:200px) {
            .box {
                width: 30%;
                background-color: lightgreen;
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="box">
        Responsive Box
    </div>

</body>
</html>
