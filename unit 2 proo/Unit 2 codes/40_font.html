<!DOCTYPE html>
<html>
<head>
<style>
/* Absolute */
.absolute {
    font-size: 30px;
}

/* Relative */
.em {
    font-size: 2em;
}

.rem {
    font-size: 2rem;
}

.percent {
    font-size: 150%;
}

/* Viewport units */
.vh {
    font-size: 5vh;
}

.vw {
    font-size: 5vw;
}
</style>
</head>

<body>

<h2 class="absolute">Absolute: 30px</h2>

<p class="em">Relative: 2em</p>

<p class="rem">Relative: 2rem</p>

<p class="percent">Relative: 150%</p>

<p class="vh">Viewport: 5vh</p>

<p class="vw">Viewport: 5vw</p>

</body>
</html>
