<!DOCTYPE html>
<html>
<head>
<style>
.normal {
    direction: rtl;
    border: 2px solid blue;
    padding: 10px;
}

.override {
    direction: rtl;
    unicode-bidi: bidi-override;
    border: 2px solid red;
    padding: 10px;
    margin-top: 10px;
}
</style>
</head>
<body>

<div class="normal">
ABC 123 DEF
</div>

<div class="override">
ABC 123 DEF
</div>

</body>
</html>
