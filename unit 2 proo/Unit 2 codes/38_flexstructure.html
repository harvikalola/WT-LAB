<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      header {
        background-color: lightskyblue;
      }
      main {
        display: flex;
        flex-direction: row;
      }
      article {
        background-color: lightpink;
        flex-grow: 7;
        
      }
      #aside1 {
        background-color: lightgreen;
        flex-grow: 3;
       
      }
       #aside2 {
        background-color: rgb(138, 179, 42);
        flex-grow: 1;
     
      }
      footer {
        background-color: lightcyan;
      }
    </style>
  </head>
  <body>
    <header>I am Header</header>
    <main>
      <article>I am Article</article>
      <aside id="aside1">I am aside 1</aside>
      <aside id="aside2">I am aside 2</aside>
    </main>
    <footer>I am footer</footer>
  </body>
</html>
