<!DOCTYPE html>
<html>

<head>
    <style>
        p {
            width: 100px;
            height: 100px;
            background-color: red;
            transition: 5s;
            font-size: 30px;
            color:white;
           
        }

        p:hover {
            width: 300px;
            height:200px;
        
        }
    </style>
</head>


<body>
    <h1>The transition Property</h1>
    <p>Hover over the div element below, to see the transition effect:</p>
    <div></div>
</body>

</html>
