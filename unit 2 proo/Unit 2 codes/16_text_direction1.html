<!DOCTYPE html>
<html>
<head>
<style>
.ltr {
    direction: ltr;
    border: 2px solid green;
    margin-bottom: 10px;
    padding: 10px;
}

.rtl {
    direction: rtl;
    border: 2px solid orange;
    padding: 10px;
}
</style>
</head>
<body>

<div class="ltr">
Name: Charmy Vora <br>
City: Rajkot
</div>

<div class="rtl">
Name: Charmy Vora <br>
City: Rajkot
</div>

</body>
</html>
