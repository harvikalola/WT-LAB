<!DOCTYPE html>
<html>

<head>
    <title>CSS Vertical Align Example</title>
    <style>
        img {
            width: 10px;
            height: 10px;
        }

        img.a { vertical-align: baseline; }
        img.b { vertical-align: top; }
        img.c { vertical-align: middle; }
        img.d { vertical-align: bottom; }
        img.e { vertical-align: text-top; }
        img.f { vertical-align: text-bottom; }
        img.g { vertical-align: sub; }
        img.h { vertical-align: super; }

        p {
            font-size: 24px;
        }
    </style>
</head>

<body>

    <h2>CSS Vertical Align Values</h2>

    <p>Baseline:
        <img class="a" src="butterfly_3.png" alt="Image">
        Image
    </p>

    <p>Top:
        <img class="b" src="butterfly_3.png" alt="Image">
        Image
    </p>

    <p>Middle:
        <img class="c" src="butterfly_3.png" alt="Image">
        Image
    </p>

    <p>Bottom:
        <img class="d" src="butterfly_3.png" alt="Image">
        Image
    </p>

    <p>Text Top:
        <img class="e" src="butterfly_3.png" alt="Image">
        Image
    </p>

    <p>Text Bottom:
        <img class="f" src="butterfly_3.png" alt="Image">
        Image
    </p>

    <p>Sub:
        <img class="g" src="butterfly_3.png" alt="Image">
        Image
    </p>

    <p>Super:
        <img class="h" src="butterfly_3.png" alt="Image">
        Image
    </p>

</body>

</html>
