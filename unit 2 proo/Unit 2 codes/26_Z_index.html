<!doctype html>
<html>
  <head>
    <style>
      div {
        height: 200px;
        width: 200px;
        border: 1px solid black;
        position: relative;
      }
      #a {
        background-color: darkseagreen;
        top: 100px;
        left: 50px;
        z-index: -3;
        position:absolute;
      }
      #b {
        background-color: peachpuff;
        top: 150px;
        left: 100px;
        z-index: -2;
        position:absolute;
      }
      #c {
        background-color: powderblue;
        top: 200px;
        left: 150px;
        z-index: -1;
        position:absolute;
      }
    </style>
  </head>

  <body>
    <div id="a">A</div>
    <div id="b">B</div>
    <div id="c">C</div>
  </body>
</html>
