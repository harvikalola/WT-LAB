<!DOCTYPE html>
    <html>

    <head>
        <style>
            div {
                height: 200px;
                width: 200px;
                position: relative;
                border: 1px solid black;
                background-color: red;
                animation-name: anim;
                animation-duration: 2s;
                animation-delay: 1s;
                animation-iteration-count: infinite;
                animation-direction: normal;
            }

            @keyframes anim {
                0% {
                    background-color: red;
                    top: 0px;
                    left: 0px;
                }

                25% {
                    background-color: green;
                    top: 0px;
                    left: 500px;
                }

                50% {
                    background-color: yellow;
                    top: 500px;
                    left: 500px;
                }

                    75% {
                        background-color: blue;
                        top: 500px;
                        left: 0px;
                    }

                    100% {
                        background-color: white;
                        top: 0px;
                        left: 0px;
                    }
                }
        </style>
    </head>

    <body>
        <div></div>
    </body>

    </html>
