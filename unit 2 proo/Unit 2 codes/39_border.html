<!DOCTYPE html>
<html>
<head>
    <title>All CSS Border Styles</title>

    <style>
        div {
            width: 200px;
            padding: 10px;
            margin: 10px;
        }

        .solid  { border: 5px solid red; }
        .dashed { border: 5px dashed blue; }
        .dotted { border: 5px dotted green; }
        .double { border: 5px double orange; }
        .groove { border: 5px groove purple; }
        .ridge  { border: 5px ridge brown; }
        .inset  { border: 5px inset gray; }
        .outset { border: 5px outset black; }
        .none   { border: 5px none red; }
        .hidden { border: 5px hidden red; }
    </style>
</head>

<body>

    <div class="solid">solid</div>
    <div class="dashed">dashed</div>
    <div class="dotted">dotted</div>
    <div class="double">double</div>
    <div class="groove">groove</div>
    <div class="ridge">ridge</div>
    <div class="inset">inset</div>
    <div class="outset">outset</div>
    <div class="none">none</div>
    <div class="hidden">hidden</div>

</body>
</html>
