<!DOCTYPE html>
<html>

<head>
  <style>
    .container {
      width: 120px;
      border: 2px solid black;
      margin: 15px;
      padding: 5px;
      overflow: hidden;
      /* Needed for text-overflow to work */

    }

    /* 1. text-overflow */
    .text-overflow {
      text-overflow: clip;
      /* Shows "..." when text is cut */
    }

    /* 2. word-break */
    .word-break {
      white-space: normal;
      /* allow wrapping */
      word-break: break-all;
      /* Breaks words at any character */
    }

    /* 3. word-wrap (overflow-wrap) */
    .word-wrap {
      white-space: normal;
      word-wrap: break-word;
      /* Breaks long words only when needed */
    }
  </style>
</head>

<body>
  <h2>CSS Text Handling Examples</h2>

  <h3>1. text-overflow: ellipsis</h3>
  <div class="container text-overflow">
    ThisIsAVeryVeryLongWordThatWillOverflowContainerAndShowEllipsis
  </div>

  <h3>2. word-break: break-all</h3>
  <div class="container word-break">
    ThisIsAVeryVeryLongWordThatWillBreakAnywhereInsideContainer
  </div>

  <h3>3. word-wrap: break-word</h3>
  <div class="container word-wrap">
    ThisIsAVeryVeryLongWordThatWillBreakOnlyWhenItHitsContainerEdge
  </div>
</body>

</html>
