<!DOCTYPE html>
<html>

<head>

    <head>
        <style>
            #div {
                height: 100px;;
                width: 100px;;

                background-color: aqua;
                animation-name: example;
                animation-duration: 2s;
                animation-iteration-count: infinite;
                animation-direction: alternate;
                animation-timing-function: cubic-bezier(1, 0.10, 0.10, 1);
            }

            @keyframes example {
                from {
                    position: relative;
                    left:0px;
                }

                to {
                    position: relative;
                    left: 500px;
                }
            }
        </style>


    </head>

<body>



    <div id="div"></div>
</body>


</html>
