<!DOCTYPE html>
<html>
<head>
<style>
p[title]{color:red}
a[target="_blank"]{background:yellow}
p[title~="flower"]{color:green}
p[lang|="en"]{color:blue}
a[href^="https"]{border:2px dotted purple}
a[href$="pdf"]{color:orange}
a[href*="w3schools"]{background:lightgray}
</style>
</head>

<body>
<h2>Attribute Selectors</h2>

<p title="info">Title attribute</p>
<a href="#" target="_blank">New Tab</a>
<p title="big red flower">Flower</p>
<p lang="en">English</p>
<p lang="en-US">US English</p>
<a href="https://google.com">Google</a>
<a href="file.pdf">PDF</a>
<a href="https://w3schools.com">W3Schools</a>

</body>
</html>
