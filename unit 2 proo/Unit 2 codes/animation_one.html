<!DOCTYPE html>
<html>
	<head>
<style> 
div {
  width: 100px;
  height: 100px;
  background-color: red;
  animation-name: example;
  animation-duration: 10s;
}

@keyframes example {
  from {background-color: red; width: 300px;
    transform: rotateX(40);}
  to {background-color: yellow;}
}
</style>
	</head>
	<body>
		<div></div>
	</body>
</html>
