<!DOCTYPE html>
<html>

<head>
    <style>
        div {
            width: 100px;
            height: 100px;
            background: red;
            transition: 3s;
            transition-delay: 3s;
        }

        div:hover {
            width: 300px;
            height:200px;
            box-shadow: 10px 10px 2px black;
       
        }
    </style>
</head>

<body>


    <body>
        <h1>The transition Property</h1>
        <p>Hover over the div element below, to see the transition effect:</p>
        <div></div>
    </body>

</html>
