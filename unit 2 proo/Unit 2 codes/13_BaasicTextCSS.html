<!DOCTYPE html>
<html>
<head>
  <style>
    /* ================= TEXT-ALIGN ================= */

    .left {
      text-align: left;        /* Aligns text to the left */
    }

    .center {
      text-align: center;      /* Aligns text to the center */
    }

    .right {
      text-align: right;       /* Aligns text to the right */
    }

    .justify {
      text-align: justify;     /* Aligns text evenly on both sides */
    }


    /* ================= TEXT-DECORATION ================= */

    .underline {
      text-decoration: underline;       /* Adds line below text */
    }

    .overline {
      text-decoration: overline;        /* Adds line above text */
    }

    .line-through {
      text-decoration: line-through;    /* Adds line through text */
    }

    .none-decoration {
      text-decoration: none;             /* Removes decoration */
    }


    /* ================= TEXT-TRANSFORM ================= */

    .uppercase {
      text-transform: uppercase;        /* Converts text to uppercase */
    }

    .lowercase {
      text-transform: lowercase;        /* Converts text to lowercase */
    }

    .capitalize {
      text-transform: capitalize;       /* Capitalizes first letter of each word */
    }

    .none-transform {
      text-transform: none;             /* Keeps original text */
    }
  </style>
</head>

<body>

  <!-- TEXT-ALIGN -->
  <p class="left">Left Aligned Text</p>
  <p class="center">Center Aligned Text</p>
  <p class="right">Right Aligned Text</p>
  <p class="justify">
    This is a paragraph with justify alignment. The text is
    evenly aligned on both the left and right sides.
  </p>


  <!-- TEXT-DECORATION -->
  <p class="underline">Underlined Text</p>
  <p class="overline">Overlined Text</p>
  <p class="line-through">Line Through Text</p>
  <p class="none-decoration">No Decoration</p>


  <!-- TEXT-TRANSFORM -->
  <p class="uppercase">hello world</p>
  <p class="lowercase">HELLO WORLD</p>
  <p class="capitalize">hello world</p>
  <p class="none-transform">Hello World</p>

</body>
</html>
