<!DOCTYPE html>
<html>
<head>
    <title>Div and Span Example</title>
</head>

<body>

    <!--Div: Block-level element; starts on a new line. -->
    <div>
        <h2>Student Information</h2>
        <p>Name: Rahul</p>
        <p>Course: Computer Engineering</p>
    </div>

    <!-- Span: Inline element; stays on the same line. -->
    <p>
        Welcome to 
        <span>Advanced Web Technology</span>
        class.
    </p>

    <!-- span can be used to highlight a specific part of text -->
    <p>
        My favorite subject is 
        <span>Web Technology</span>.
    </p>

</body>
</html>
