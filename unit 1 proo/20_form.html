
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>

    <!-- Main Registration Form -->
    <form method="post" action="welcome.html" target="_blank">

        <h2>Student Registration Form</h2>

        <!-- ================= Personal Information ================= -->
        <fieldset>
            <legend>Personal Information</legend>

            <!-- Full Name -->
            <label for="fullname">Full Name:</label>
            <input type="text"
                   id="fullname"
                   name="fullname"
                   placeholder="Enter your full name"
                   autocomplete="name"
                   minlength="4"
                   maxlength="50"
                   required>
            <br><br>

            <!-- Email -->
            <label for="email">Email:</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="example@gmail.com"
                   autocomplete="email"
                   required>
            <br><br>

            <!-- Password -->
            <label for="password">Password:</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter password"
                   minlength="8"
                   required>
            <br><br>

            <!-- Phone Number -->
            <label for="phone">Phone Number:</label>
            <input type="tel"
                   id="phone"
                   name="phone"
                   placeholder="Enter 10-digit phone number"
                   autocomplete="tel"
                   pattern="[0-9]{10}"
                   maxlength="10"
                   required>
            <br><br>

            <!-- Age -->
            <label for="age">Age:</label>
            <input type="number"
                   id="age"
                   name="age"
                   min="1"
                   max="120"
                   required>
            <br><br>

            <!-- Gender -->
            <label>Gender:</label>

            <input type="radio"
                   id="male"
                   name="gender"
                   value="male"
                   required>
            <label for="male">Male</label>

            <input type="radio"
                   id="female"
                   name="gender"
                   value="female">
            <label for="female">Female</label>

            <input type="radio"
                   id="other"
                   name="gender"
                   value="other">
            <label for="other">Other</label>

            <br><br>

            <!-- Address -->
            <label for="address">Address:</label>
            <br>
            <textarea id="address"
                      name="address"
                      rows="4"
                      cols="40"
                      placeholder="Enter your complete address"></textarea>
            <br><br>

        </fieldset>


        <!-- ================= Preferences & Extras ================= -->
        <fieldset>
            <legend>Preferences & Extras</legend>

            <!-- File Upload -->
            <label for="profile">Upload Profile Picture:</label>
            <input type="file"
                   id="profile"
                   name="profile"
                   accept="image/*"
                   required>
            <br><br>

            <!-- Color -->
            <label for="favcolor">Favorite Color:</label>
            <input type="color"
                   id="favcolor"
                   name="favcolor"
                   value="#0000ff">
            <br><br>

            <!-- Search -->
            <label for="search">Search for Course:</label>
            <input type="search"
                   id="search"
                   name="search"
                   placeholder="Search course">
            <br><br>

            <!-- Range -->
            <label for="interest">Course Interest Range:</label>
            <input type="range"
                   id="interest"
                   name="interest"
                   min="0"
                   max="10"
                   value="5">
            <br><br>

            <!-- URL -->
            <label for="website">Personal Website:</label>
            <input type="url"
                   id="website"
                   name="website"
                   placeholder="https://example.com">
            <br><br>

            <!-- Select with Optgroup -->
            <label for="courseType">Course Type:</label>

            <select id="courseType"
                    name="courseType"
                    required>

                <optgroup label="Engineering">
                    <option value="cse">Computer Engineering</option>
                    <option value="ece">Electronics Engineering</option>
                    <option value="me">Mechanical Engineering</option>
                </optgroup>

                <optgroup label="Management">
                    <option value="bba">BBA</option>
                    <option value="mba">MBA</option>
                </optgroup>

            </select>
            <br><br>

            <!-- Datalist -->
            <label for="country">Preferred Country:</label>

            <input list="countries"
                   id="country"
                   name="country"
                   placeholder="Select or type country"
                   required>

            <datalist id="countries">
                <option value="India">
                <option value="USA">
                <option value="Canada">
                <option value="Germany">
                <option value="Australia">
            </datalist>

            <br><br>

            <!-- Checkbox -->
            <input type="checkbox"
                   id="terms"
                   name="terms"
                   required>

            <label for="terms">I agree to the Terms and Conditions</label>

            <br><br>

        </fieldset>


        <!-- ================= Date & Time Information ================= -->
        <fieldset>
            <legend>Date & Time Information</legend>

            <!-- Date -->
            <label for="reg_dob">Select Date of Birth:</label>
            <input type="date"
                   id="reg_dob"
                   name="reg_dob"
                   required>
            <br><br>

            <!-- Time -->
            <label for="reg_time">Select Time:</label>
            <input type="time"
                   id="reg_time"
                   name="reg_time"
                   required>
            <br><br>

            <!-- Month -->
            <label for="reg_month">Select Month:</label>
            <input type="month"
                   id="reg_month"
                   name="reg_month"
                   required>
            <br><br>

            <!-- Week -->
            <label for="reg_week">Select Week:</label>
            <input type="week"
                   id="reg_week"
                   name="reg_week"
                   required>
            <br><br>

            <!-- Date and Time -->
            <label for="reg_datetime">Select Date and Time:</label>
            <input type="datetime-local"
                   id="reg_datetime"
                   name="reg_datetime"
                   required>
            <br><br>

        </fieldset>


        <!-- ================= Form Controls ================= -->
        <fieldset>
            <legend>Form Controls</legend>

            <!-- Hidden Input -->
            <input type="hidden"
                   name="AC"
                   value="12345678912345">

            <!-- Normal Button -->
            <button type="button">
                Click Me
            </button>

            <br><br>

            <!-- Image Button -->
            <input type="image"
                   src="MU LOGO.png"
                   alt="Register Now"
                   width="100"
                   height="40">

            <br><br>

            <!-- Submit Button -->
            <input type="submit"
                   name="reg_submit"
                   value="Register Now">

            <br><br>

            <!-- Reset Button -->
            <input type="reset"
                   value="Reset Form">

        </fieldset>

    </form>

</body>

</html>
