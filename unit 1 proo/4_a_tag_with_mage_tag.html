<!DOCTYPE html>
<html>
<head>
    <title>Anchor Tag Example</title>
</head>
<body>

    <h2>Anchor Tag</h2>

    <a href="https://www.google.com">Visit Google</a>

    <h2>Anchor Tag with Image</h2>

    <a href="https://www.google.com">
        <img src="google.png" alt="Google" width="150">
    </a>

</body>
</html>
