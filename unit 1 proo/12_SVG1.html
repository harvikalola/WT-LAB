<!DOCTYPE html>
<html>
<body>

<!-- Circle -->
<h3>Circle</h3>
<svg width="250" height="200">
    <circle cx="170" cy="100" r="50" 
            fill="red"
            stroke="black"
            stroke-width="20"
            stroke-opacity="0.8"
            fill-opacity="0.8"/>
</svg>>

<!-- Rectangle -->
<h3>Rectangle</h3>
<svg width="250" height="150">
    <rect x="30" y="30"
          width="150"
          height="80"
          fill="blue"
          stroke="black"
          stroke-width="2"/>
</svg>

<!-- Ellipse -->
<h3>Ellipse</h3>
<svg width="300" height="200">
    <ellipse cx="150" cy="100"
             rx="20"
             ry="100"
             fill="green"
             stroke="black"
             stroke-width="2"/>
</svg>

<!-- Line -->
<h3>Line</h3>
<svg width="250" height="150">
    <line x1="20" y1="90"
          x2="90" y2="90"
          stroke="red"
          stroke-width="3"/>
</svg>

<!-- Triangle -->
<h3>Triangle</h3>
<svg width="250" height="200">
    <polygon points="125,20 220,170 30,170"
             fill="orange"
             stroke="black"
             stroke-width="2"/>
</svg>

<!-- Polygon -->
<h3>Polygon (Hexagon)</h3>
<svg width="300" height="250">
    <polygon points="150,20 220,70 220,170 150,220 80,170 80,70"
             fill="lime"
             stroke="black"
             stroke-width="2"/>
</svg>

<!-- Star -->

<h3>Star</h3>
<svg width="250" height="150">
    <polygon points="100,100 150,20 180,100 100,50 180,50 " 
             fill="gold"
             stroke="black"
             stroke-width="2"/>
</svg>

<!-- Text -->
<h3>Text</h3>
<svg width="400" height="80">
    <text x="20" y="50"
          font-size="30"
          fill="purple"
          font-weight="bold">
        Marwadi University
    </text>
    <circle/>
    
</svg>

</body>
</html>
